[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/audio/*.m4a"
  [headers.values]
    Content-Type = "audio/mp4"
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*.aac"
  [headers.values]
    Content-Type = "audio/aac"
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=31536000, immutable"
